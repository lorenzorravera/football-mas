  player_season_stats:
    description: 'Season-level player fact table. Mixes outfield and goalkeeper metrics in one table; goalkeeper-only metrics
      are NULL for outfield players.

      '
    grain: One row per player-season-team.
    primary_key: id
    foreign_keys:
      player_id: players.player_id
      season_id: seasons.season_id
      team_id: teams.team_id
    unique_constraints:
    - - player_id
      - season_id
      - team_id
    naming_note: Duplicated analytical metrics are suffixed with _pss.
    columns:
      id:
        type: SERIAL
        nullable: false
        description: Surrogate row id.
      player_id:
        type: INT
        nullable: false
        description: FK to players.
      season_id:
        type: INT
        nullable: false
        description: FK to seasons.
      team_id:
        type: INT
        nullable: true
        description: FK to teams.
      age:
        type: SMALLINT
        nullable: true
