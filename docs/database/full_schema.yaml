  current_loaded_leagues:
  - league_code: ENG-PL
    league_name: Premier League
    country: England
    loaded_in_live_db: true
    seeded_in_current_sql: true
  future_supported_leagues:
  - league_code: ENG-PL
    league_name: Premier League
    country: England
    status: current
  - league_code: GER-BL
    league_name: Bundesliga
    country: Germany
    status: planned
