    country: Italy
    status: planned
  - league_code: ESP-LL
    league_name: La Liga
    country: Spain
    status: planned
  - league_code: FRA-L1
    league_name: Ligue 1
    country: France
    status: planned
  - league_code: NED-ED
    league_name: Eredivisie
    country: Netherlands
    status: planned
  - league_code: BEL-PL
    league_name: Jupiler Pro League
    country: Belgium
    status: planned
  - league_code: POR-PL
    league_name: Primeira Liga
    country: Portugal
    status: planned
  - league_code: TUR-SL
    league_name: Super Lig
    country: Turkey
    status: planned
  - league_code: SCO-PL
    league_name: Premiership
    country: Scotland
