      jobs.
    manual_refresh_examples:
    - REFRESH MATERIALIZED VIEW vw_player_season_summary;
    - REFRESH MATERIALIZED VIEW vw_player_match_summary;
    - REFRESH MATERIALIZED VIEW vw_player_shooting_profile;
    - REFRESH MATERIALIZED VIEW vw_player_availability;
    - REFRESH MATERIALIZED VIEW vw_match_summary;
relationships:
  high_level:
  - competitions 1-to-many seasons
  - seasons 1-to-many matches
  - teams referenced by matches as home_team_id and away_team_id
  - players 1-to-many player_season_stats
  - players 1-to-many player_season_splits
  - players 1-to-many player_match_performance
  - players 1-to-many player_market_values
  - players 1-to-many player_transfers
  - players 1-to-many player_injury_spells
  - matches 1-to-many player_match_performance via match_id
  - matches 1-to-many match_events via game_id/season/league context in views
query_guidance:
  general:
  - Use materialized views for analyst-facing queries whenever possible.
  - Use base tables when precise load diagnostics or row-level debugging is needed.
  - The current live DB is Premier League only; do not assume multi-league coverage in current query results.
  - league_code is the canonical cross-table league identifier.
  - season uses format YYYY-YYYY.
  join_keys:
  - Match-level joins should prefer match_id where available.
  - Event-level joins often rely on game_id plus season/league context.
  - Season-level joins often require seasons.season_id internally, but views expose season labels.
  partition_notes:
  - player_match_performance and match_events are partitioned by league_code then season.
  - Queries filtered by league_code and season will benefit most from partition pruning.
  naming_notes:
  - Suffixed metrics (_pss, _pssp, _pmp, _m) exist to avoid ambiguous duplicate column names.
  - Do not assume unsuffixed analytical metrics are present in all tables.
known_limitations:
  current_sql_scope:
  - Current SQL seed data only inserts ENG-PL into competitions.
  - Current SQL only creates seasons 2020-2021 through 2024-2025.
  - Current partitions exist only for ENG-PL.
  - Corrected SQL does not create vw_team_season_summary because team_season_standings and related source tables are not present.
  - Corrected SQL does not create pg_cron jobs because the cron schema is not enabled in the current Aiven service.
  - competitions.league_code is logically unique but not enforced with a UNIQUE constraint in the current SQL.
  future_migration_requirements:
  - To support all 10 leagues, competitions seed data must be extended.
  - To support all 10 leagues, seasons seed data must be extended for each competition.
  - To support all 10 leagues, partition creation must be generalized for player_match_performance and match_events.
  consistency_notes:
  - This YAML reflects the uploaded SQL definition, even where that SQL is not yet fully generalized.
  - If the SQL file changes, this YAML should be regenerated to stay aligned.
recommended_updates_for_full_10_league_rollout:
  competitions:
    action: Insert all 10 league rows.
  seasons:
    action: Generate or insert all intended season rows for all competitions.
  partitions:
    action: Create partition trees for every league_code and season combination.
  teams:
    action: Expand seed data or rely on loader-driven upserts from canonical transformed datasets.
  yaml:
    action: Update current_loaded_leagues and partition scope once non-EPL leagues are live.
