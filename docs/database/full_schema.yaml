        type: SMALLINT
        nullable: true
        description: Non-penalty goals in this split.
  player_match_performance:
    description: 'Match-level player fact table combining Understat / FBref-style player match metrics. Partitioned by league_code
      then season.

      '
    grain: One row per player-match-league-season.
    partitioning:
      level_1: LIST(league_code)
      level_2: LIST(season)
    primary_key:
    - player_id
    - match_id
    - season
    - league_code
    current_partitions:
      league_partitions:
      - player_match_performance_eng_pl
      season_partitions:
      - player_match_performance_eng_pl_2020_2021
      - player_match_performance_eng_pl_2021_2022
      - player_match_performance_eng_pl_2022_2023
      - player_match_performance_eng_pl_2023_2024
      - player_match_performance_eng_pl_2024_2025
    columns:
      player_id:
        type: INT
        nullable: false
        description: Player identifier.
      match_id:
        type: VARCHAR(20)
        nullable: false
        description: Warehouse match identifier.
      season:
        type: VARCHAR(9)
        nullable: false
        description: Season label (stored directly for partitioning).
      league_code:
        type: VARCHAR(10)
        nullable: false
        description: League code (stored directly for partitioning).
      position:
        type: VARCHAR(10)
        nullable: true
        description: Player position in that match.
      minutes_played:
        type: SMALLINT
        nullable: true
        description: Minutes played.
      match_goals:
        type: SMALLINT
        nullable: true
        description: Goals scored in the match.
      match_assists:
        type: SMALLINT
        nullable: true
        description: Assists in the match.
      match_shots:
        type: SMALLINT
        nullable: true
        description: Shots in the match.
      shots_on_target_pmp:
        type: SMALLINT
        nullable: true
        description: Shots on target.
      xg_pmp:
        type: NUMERIC(5,3)
        nullable: true
        description: Expected goals.
      xa_pmp:
        type: NUMERIC(5,3)
        nullable: true
