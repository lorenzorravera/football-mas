seasons_context:
  current_seeded_seasons:
  - 2020-2021
  - 2021-2022
  - 2022-2023
  - 2023-2024
  - 2024-2025
  future_target_seasons_note: Planned expansion may extend both season range and league coverage.
naming_suffixes:
  pss: player_season_stats
  pssp: player_season_splits
  pmp: player_match_performance
  m: matches
  notes:
  - Only duplicated analytical metric names were suffixed.
  - Identifiers such as player_id, season, team, game_id remain unsuffixed where used as join keys.
tables:
  competitions:
    description: Dimension table for competitions / leagues.
    grain: One row per competition.
    primary_key: competition_id
    current_seeded_rows:
    - league_code: ENG-PL
      league_name: Premier League
      country: England
      tier: 1
    future_expected_rows: All 10 target leagues.
    columns:
      competition_id:
        type: SERIAL
        nullable: false
        description: Surrogate primary key.
      league_code:
        type: VARCHAR(10)
        nullable: false
        description: Canonical competition code such as ENG-PL.
      league_name:
        type: VARCHAR(100)
        nullable: false
        description: Display competition name.
      country:
        type: VARCHAR(50)
        nullable: false
        description: Competition country.
      tier:
        type: SMALLINT
        nullable: true
        default: 1
        description: Competition tier; top-flight leagues use 1.
  seasons:
    description: Season dimension table. Each row belongs to one competition.
    grain: One row per competition-season.
    primary_key: season_id
    foreign_keys:
      competition_id: competitions.competition_id
    unique_constraints:
    - - competition_id
      - season
    columns:
      season_id:
        type: SERIAL
        nullable: false
        description: Surrogate season key.
      competition_id:
        type: INT
        nullable: false
        description: FK to competitions.
      season:
        type: VARCHAR(9)
        nullable: false
        description: Season label in format YYYY-YYYY.
      start_date:
        type: DATE
        nullable: true
        description: Season start date.
      end_date:
        type: DATE
        nullable: true
        description: Season end date.
  players:
    description: Master player dimension.
    grain: One row per player.
    primary_key: player_id
    columns:
      player_id:
        type: INT
        nullable: false
        description: Canonical player identifier used across player-level fact tables.
      player_name:
        type: VARCHAR(100)
        nullable: false
        description: Canonical player display name.
      nationality:
        type: VARCHAR(50)
        nullable: true
        description: Nationality string.
      birth_year:
        type: SMALLINT
        nullable: true
        description: Birth year.
      height:
        type: SMALLINT
        nullable: true
        description: Height, expected in centimeters if populated.
      foot:
        type: VARCHAR(5)
        nullable: true
        description: Preferred foot, e.g. left/right.
  teams:
    description: Master team dimension.
    grain: One row per team.
    primary_key: team_id
    unique_constraints:
    - - team_name
    current_scope_note: Currently seeded with Premier League-era clubs appearing in the current data.
    columns:
      team_id:
        type: SERIAL
        nullable: false
        description: Surrogate team key.
      team_name:
        type: VARCHAR(100)
        nullable: false
        description: Canonical team name.
  matches:
    description: 'Core match fact table. One row per match. Includes match metadata, match result, match-level team box score
      variables, selected betting averages, and operational fields used to link downstream tables.

      '
    grain: One row per match.
    primary_key: match_id
    foreign_keys:
      season_id: seasons.season_id
      home_team_id: teams.team_id
      away_team_id: teams.team_id
    unique_constraints:
    - - game_id
    columns:
      match_id:
        type: VARCHAR(20)
        nullable: false
        description: Canonical match identifier used across warehouse tables.
      game_id:
        type: INT
        nullable: true
        description: External match identifier, used especially with event-level feeds.
      season_id:
        type: INT
        nullable: false
        description: FK to seasons.
      matchweek:
        type: SMALLINT
        nullable: true
        description: Matchweek / round number.
      match_date:
        type: DATE
        nullable: true
        description: Date of the match.
      kickoff_time:
        type: TIME
        nullable: true
        description: Scheduled or recorded kickoff time.
      home_team_id:
        type: INT
        nullable: true
        description: FK to teams for home team.
      away_team_id:
        type: INT
        nullable: true
        description: FK to teams for away team.
      home_score:
        type: SMALLINT
        nullable: true
        description: Full-time home goals.
      away_score:
        type: SMALLINT
        nullable: true
        description: Full-time away goals.
      ft_result:
        type: CHAR(1)
        nullable: true
        description: Full-time result, typically H/D/A.
      ht_home_score:
        type: SMALLINT
        nullable: true
        description: Half-time home goals.
      ht_away_score:
        type: SMALLINT
        nullable: true
        description: Half-time away goals.
      ht_result:
        type: CHAR(1)
        nullable: true
        description: Half-time result, typically H/D/A.
      home_formation:
        type: VARCHAR(10)
        nullable: true
        description: Home team formation string.
      away_formation:
        type: VARCHAR(10)
        nullable: true
        description: Away team formation string.
      venue:
        type: VARCHAR(100)
        nullable: true
        description: Venue / stadium name.
      attendance_m:
        type: INT
        nullable: true
        description: Attendance; suffixed to avoid duplicate measure name collisions.
      referee:
        type: VARCHAR(100)
        nullable: true
        description: Main referee name.
      home_shots:
        type: SMALLINT
        nullable: true
        description: Home team total shots.
      away_shots:
        type: SMALLINT
        nullable: true
        description: Away team total shots.
      home_shots_on_target:
        type: SMALLINT
        nullable: true
        description: Home shots on target.
      away_shots_on_target:
