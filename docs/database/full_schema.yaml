        nullable: true
        description: Save percentage.
      penalties_faced:
        type: SMALLINT
        nullable: true
        description: Penalties faced.
      penalty_saves:
        type: SMALLINT
        nullable: true
        description: Penalty saves.
  player_season_splits:
    description: 'Season-level player split table for grouped contexts such as position, situation, shot zone, or shot type.
      Exact group semantics depend on upstream Understat-derived extraction.

      '
    grain: One row per player-season-group_type-group_name.
    primary_key: id
    foreign_keys:
      player_id: players.player_id
      season_id: seasons.season_id
    unique_constraints:
    - - player_id
      - season_id
      - group_type
      - group_name
    naming_note: Duplicated analytical metrics are suffixed with _pssp.
    columns:
      id:
        type: SERIAL
        nullable: false
        description: Surrogate row id.
      player_id:
        type: INT
        nullable: false
        description: FK to players.
      season_id:
        type: INT
        nullable: false
        description: FK to seasons.
      group_type:
        type: VARCHAR(50)
        nullable: false
        description: Grouping dimension, e.g. situation / shot zone / position.
      group_name:
        type: VARCHAR(50)
        nullable: false
        description: Group label within group_type.
      matches_played_pssp:
        type: SMALLINT
        nullable: true
        description: Matches played in this split.
      minutes_pssp:
        type: INT
        nullable: true
        description: Minutes in this split.
      goals_pssp:
        type: SMALLINT
        nullable: true
        description: Goals in this split.
      assists_pssp:
        type: SMALLINT
        nullable: true
        description: Assists in this split.
      yellow_cards_pssp:
        type: SMALLINT
        nullable: true
        description: Yellow cards in this split.
      red_cards_pssp:
        type: SMALLINT
        nullable: true
        description: Red cards in this split.
      shots_pssp:
        type: SMALLINT
        nullable: true
