  match_events:
    description: 'Event-level fact table for detailed on-ball actions. Partitioned by league_code then season. Designed primarily
      around WhoScored-style event schema with extensive categorical qualifiers.

      '
    grain: One row per event.
    partitioning:
      level_1: LIST(league_code)
      level_2: LIST(season)
    primary_key:
    - event_id
    - season
    - league_code
    current_partitions:
      league_partitions:
      - match_events_eng_pl
      season_partitions:
      - match_events_eng_pl_2020_2021
      - match_events_eng_pl_2021_2022
      - match_events_eng_pl_2022_2023
      - match_events_eng_pl_2023_2024
      - match_events_eng_pl_2024_2025
    columns:
      event_id:
        type: BIGSERIAL
        nullable: false
        description: Event identifier, unique only together with season and league_code.
      season:
        type: VARCHAR(9)
        nullable: false
        description: Season label for partitioning.
      league_code:
        type: VARCHAR(10)
        nullable: false
        description: League code for partitioning.
      game_id:
        type: INT
        nullable: true
        description: External match id linking to match feed.
      period:
        type: VARCHAR(20)
        nullable: true
        description: Match period.
      minute:
        type: SMALLINT
        nullable: true
        description: Minute of event.
      second:
        type: SMALLINT
        nullable: true
        description: Second of event.
      expanded_minute:
        type: SMALLINT
        nullable: true
        description: Expanded / stoppage-time minute.
      type:
        type: VARCHAR(50)
        nullable: true
        description: Event type.
      outcome_type:
        type: VARCHAR(50)
        nullable: true
        description: Outcome label.
      team_id:
        type: INT
        nullable: true
        description: Source team id.
      team:
