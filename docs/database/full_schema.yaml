schema_version: current_aiven_context_from_corrected_sql_completedb
source_files:
  sql_definition: Block_updated_with_suffixes_CORRECTED.sql
  prior_yaml_reference: schema_context.yaml
database:
  platform: Aiven PostgreSQL
  domain: football analytics
  design_status:
    current_live_scope: Premier League only
    future_target_scope: 10 leagues
    notes:
    - Current live database contains only Premier League data.
    - Current SQL seed data and partitions are also Premier League only.
    - Schema structure is intended to be updated later for all target leagues.
    - Current SQL excludes pg_cron scheduling and excludes vw_team_season_summary because its source tables are not present.
  normalization: Mostly normalized analytical warehouse schema with summary views
  refresh_strategy: Manual materialized view refresh. pg_cron scheduling is not present in the current Aiven SQL structure.
  partitioning_strategy:
    player_match_performance:
      partitioned_by:
      - league_code
      - season
      current_partition_scope:
      - ENG-PL
      - 2020-2021
      - 2021-2022
      - 2022-2023
      - 2023-2024
      - 2024-2025
    match_events:
      partitioned_by:
      - league_code
      - season
      current_partition_scope:
      - ENG-PL
      - 2020-2021
      - 2021-2022
      - 2022-2023
      - 2023-2024
      - 2024-2025
