[project]
name = "football-mas"
version = "0.1.0"
description = "Conversational football analytics and controlled evaluation of multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gradio>=4.0.0",
    "langgraph>=0.0.40",
    "litellm==1.52.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "langfuse==2.44.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "kaleido>=1.2.0",
    "sqlalchemy>=2.0.46",
    "chainlit>=1.0.0",
    "modal>=0.60.0",
    "psycopg2-binary",
    "tabulate>=0.9.0",
    "prediction-agent",
]

[tool.uv.sources]
prediction-agent = { path = "prediction", editable = true }
